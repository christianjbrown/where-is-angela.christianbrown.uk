# Rebuilds the page from site/ and the pinned engine, and fails if what is
# committed differs: an edit to site/ without running ./build.sh, or an
# engine bump without rebuilding. The images are left out, because they
# render a little differently on Linux than on a Mac; the share card's
# version tag in index.html is left out for the same reason.
name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: cd engine && npm ci
      - run: node engine/tools/build.js --site site --out "$RUNNER_TEMP/fresh"
      - name: Compare with what is committed
        run: |
          fresh="$RUNNER_TEMP/fresh"
          strip() { sed -E 's/og-card\.png\?v=[0-9a-f]+/og-card.png?v=/g' "$1"; }
          status=0
          diff <(strip index.html) <(strip "$fresh/index.html") || status=1
          for f in style.css robots.txt .nojekyll CNAME; do
            cmp -s "$f" "$fresh/$f" || { echo "::error file=$f::$f is out of date"; status=1; }
          done
          diff -r data "$fresh/data" || status=1
          diff -r src "$fresh/src" || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::The committed page does not match site/ and the engine. Run ./build.sh and commit what it writes."
          fi
          exit "$status"
